name: Feature request
description: Propose a new capability or a change to existing behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what's awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen instead? Mockups or API sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Policy engine / governance
        - Marketplace
        - Receipts / settlement
        - Review inbox
        - Fleet
        - Reasoning (model calls)
        - Persistence / data model
        - Developer experience / CI
        - Other
  - type: textarea
    id: governance
    attributes:
      label: Governance impact
      description: Does this change who can authorize spend, or how it's audited? If so, describe the policy rule.
